name: First Milk feature validation
on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/portal-features-ci.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/portal-features-ci.yml'
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and testing dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run isolated new feature and security regressions
        run: python -m pytest -q

      - name: Observe public portal response headers
        if: always()
        shell: python
        run: |
          import subprocess
          import urllib.error
          import urllib.request
          for role in ('customer', 'delivery', 'admin'):
              host = role + '.firstmilkventure.com'
              cname = subprocess.run(['dig', '+time=2', '+tries=1', '+short', 'CNAME', host],
                                     capture_output=True, text=True).stdout.strip()
              print(f'{host} CNAME {cname or "(no CNAME returned)"}')
              try:
                  with urllib.request.urlopen('https://' + host + '/', timeout=10) as page:
                      for key in ('Server', 'Content-Security-Policy', 'Strict-Transport-Security'):
                          print(f'  {key} = {page.headers.get(key, "(absent)")}')
              except (OSError, urllib.error.URLError) as error:
                  print(f'  Unable to read public response ({type(error).__name__})')
