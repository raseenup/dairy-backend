name: First Milk feature validation
on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'infra/portal-hosting.yaml'
      - '.github/workflows/portal-features-ci.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'infra/portal-hosting.yaml'
      - '.github/workflows/portal-features-ci.yml'
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and testing dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run isolated new feature and security regressions
        run: python -m pytest -q

      - name: Observe public portal response headers
        if: always()
        shell: python
        run: |
          import subprocess
          import urllib.error
          import urllib.request
          for role in ('customer', 'delivery', 'admin'):
              host = role + '.firstmilkventure.com'
              cname = subprocess.run(['dig', '+time=2', '+tries=1', '+short', 'CNAME', host],
                                     capture_output=True, text=True).stdout.strip()
              print(f'{host} CNAME {cname or "(no CNAME returned)"}')
              try:
                  with urllib.request.urlopen('https://' + host + '/', timeout=10) as page:
                      for key in ('Server', 'Content-Security-Policy', 'Strict-Transport-Security'):
                          print(f'  {key} = {page.headers.get(key, "(absent)")}')
              except (OSError, urllib.error.URLError) as error:
                  print(f'  Unable to read public response ({type(error).__name__})')

      - name: Validate portal hosting configuration against the Render schema
        run: |
          python -m pip install --quiet PyYAML jsonschema
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import jsonschema
          import yaml
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json', timeout=20) as source:
              schema = json.load(source)
          blueprint = yaml.safe_load(Path('infra/portal-hosting.yaml').read_text())
          jsonschema.validate(blueprint, schema)
          services = blueprint['services']
          expected = {f'{role}.firstmilkventure.com' for role in ('customer','delivery','admin')}
          assert {s['domains'][0] for s in services} == expected
          for service in services:
              headers = {row['name']:row['value'] for row in service['headers'] if row['path'] == '/*'}
              assert "frame-ancestors 'none'" in headers['Content-Security-Policy']
              assert 'https://checkout.razorpay.com' in headers['Content-Security-Policy']
              assert headers['Strict-Transport-Security'] == 'max-age=31536000'
          PY
