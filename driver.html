<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Milk Venture - Driver Hub (delivery.firstmilkventure.com)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-amber-600 rounded-xl flex items-center justify-center text-white font-black text-xl">🚚</div>
                <div>
                    <h1 class="text-base font-black text-gray-900 tracking-tight">First Milk Venture</h1>
                    <p class="text-[10px] text-amber-600 font-bold uppercase tracking-wider">Driver Hub (delivery.firstmilkventure.com)</p>
                </div>
            </div>
            <button onclick="handleDriverLogout()" class="text-xs text-red-600 font-bold hover:underline">Sign Out</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Driver Secret Access Code Login Form -->
        <div id="driver-login-section" class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-2xl mx-auto flex items-center justify-center text-3xl font-bold mb-3">🚚</div>
                <h2 class="text-xl font-black text-gray-900">Delivery Driver Portal</h2>
                <p class="text-xs text-gray-500 mt-1">Enter unique secret code given by admin to access portal.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Unique Driver Secret Code</label>
                    <input type="password" id="driver-access-key" placeholder="Enter unique secret code..." class="w-full px-3 py-2.5 text-xs border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 font-mono">
                </div>
                <!-- Security Fix: Clean error message without showing correct secret in hints -->
                <div id="driver-login-error" class="hidden text-xs text-red-600 font-semibold bg-red-50 p-3 rounded-xl border border-red-200"></div>
                <button onclick="authenticateDriver()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-xs shadow transition-colors">
                    Login to Driver Portal →
                </button>
            </div>
        </div>

        <!-- Authorized Driver Workspace -->
        <div id="driver-dashboard" class="hidden space-y-6">
            
            <!-- Driver Profile Management (Name, Phone, Address) -->
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-black text-gray-900 text-base">Driver Profile & Personal Details</h3>
                    <button onclick="saveDriverProfile()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">Save Details</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Driver Name</label>
                        <input type="text" id="driver-self-name" placeholder="Enter full name" class="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Phone Number</label>
                        <input type="text" id="driver-self-phone" placeholder="Enter phone number" class="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Operating Base Address</label>
                        <input type="text" id="driver-self-address" placeholder="Enter address details" class="w-full px-3 py-2 border rounded-xl" />
                    </div>
                </div>
            </div>

            <!-- Route Orders -->
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
                <h3 class="font-black text-gray-900 text-base">Assigned Dispatch Routes</h3>
                <div id="driver-routes-container" class="space-y-3">
                    <p class="text-xs text-gray-500">Loading delivery orders...</p>
                </div>
            </div>

        </div>

    </main>

    <script src="driver.js"></script>
</body>
</html>
