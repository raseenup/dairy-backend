# Optional Render hosting for the three public portal domains. Apply after reviewing the hosting and DNS cutover.
services:
  - type: web
    name: fmv-customer-secure-portal
    runtime: static
    repo: https://github.com/raseenup/firstmilk-customer
    branch: main
    buildCommand: mkdir -p public-portal && cp index.html manifest.webmanifest *.js *.css public-portal/ && cp -R assets styles public-portal/
    staticPublishPath: ./public-portal
    domains:
      - customer.firstmilkventure.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://backend.firstmilkventure.com https://api.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; media-src 'self' blob: https://backend.firstmilkventure.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "same-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(self)"
  - type: web
    name: fmv-delivery-secure-portal
    runtime: static
    repo: https://github.com/raseenup/firstmilk-delivery
